frr version 8.4_git
frr defaults traditional
hostname r1
no ipv6 forwarding
!
!
!
!
router bgp 65001
 bgp router-id 10.11.0.10
 no bgp ebgp-requires-policy
 neighbor 10.10.0.20 remote-as 65002
 neighbor 10.11.0.20 remote-as 65003
 !
 address-family ipv4 unicast
  neighbor 10.10.0.20 route-map LOW-LP in
 exit-address-family
exit
!
route-map LOW-LP permit 10
 set local-preference 50
exit
!
end
