frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 2.2.2.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.1.12.2/24
 ip ospf area 0
exit
!
interface eth2
 ip address 10.2.23.2/24
 ip ospf area 0
exit
!
router ospf
 ospf router-id 2.2.2.2
!
line vty
!
end
