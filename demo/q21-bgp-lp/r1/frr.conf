frr version 8.4_git
frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface eth1
 ip address 10.10.0.10/24
exit
!
interface eth2
 ip address 10.11.0.10/24
exit
!
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 10.10.0.20 remote-as 65002
 neighbor 10.11.0.20 remote-as 65003
 !
 address-family ipv4 unicast
  neighbor 10.10.0.20 route-map LOW-LP in
 exit-address-family
exit
!
! r2 (via 10.10.0.20) is de-preferenced with LocalPref 50; r3 keeps the default 100,
! so r1 selects r3 as best for 8.8.8.0/24 by Local Preference (100 > 50) — RCL Q21.
route-map LOW-LP permit 10
 set local-preference 50
exit
!
end
