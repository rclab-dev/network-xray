# network-xray as a netlab tool (works with netlab today, before it is part of netlab itself).
# In your topology:
#   defaults.sources.extra: [ <network-xray>/docker/netlab-defaults.yml ]
#   tools:
#     network-xray:
# netlab up then starts network-xray next to the lab: open http://<host>:8600/ (8600 + the multilab id with the multilab plugin).
# network-xray reads router state with `docker exec <node> vtysh -c 'show ...'` (FRR) / sr_cli (SR Linux): 'show' commands only.
# It is given the Docker socket, which is root-equivalent on the host: run it only on a lab machine.
# netlab create / netlab up also write network-xray.json (the transformed topology, without the defaults):
# network-xray reads the lab's validate: tests from it and shows them as a band (3 / 5, ✓ Solved) with marks on the graph.
netlab:
  create:
    output:
      json:
        options: nodefault
        output: network-xray.json
# Rows in the graph: give a node containerlab's graph-level label (1 = top row), e.g.
#   nodes.s1.clab.labels: { graph-level: 1 }
# (netlab does not pass clab labels by default: the next lines allow the clab.labels node attribute)
providers:
  clab:
    attributes:
      node:
        _keys:
          labels: dict
tools:
  network-xray:
    runtime: docker
    docker:
      up:
        docker run -d --rm
          --name "{name}_network_xray"
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$(pwd)":/lab:ro
          -p { 8600 + defaults.multilab.id if defaults.multilab.id else 8600 }:8600
          ghcr.io/rclab-dev/network-xray:1
          --topo /lab/clab.yml
      message: >-
        Open http://{sys.ipurl}:{ 8600 + defaults.multilab.id if defaults.multilab.id else 8600 }/ in your browser
        (network-xray only runs 'show' commands, but it is given the Docker socket)
      down:   # nx_unread (2026-10-17): network-xray.json (written by netlab create, holds the lab's passwords too) goes with the lab
      - rm -f network-xray.json
      - docker kill '{name}_network_xray'
