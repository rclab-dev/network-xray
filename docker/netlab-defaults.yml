# network-xray as a netlab tool (works with netlab today, before it is part of netlab itself).
# In your topology:
#   defaults.sources.extra: [ <network-xray>/docker/netlab-defaults.yml ]
#   tools:
#     network-xray:
# netlab up then starts network-xray next to the lab: open http://<host>:8600/ (8600 + the multilab id with the multilab plugin).
# network-xray reads router state with `docker exec <node> vtysh -c 'show ...'` (FRR) / sr_cli (SR Linux): 'show' commands only.
# It is given the Docker socket, which is root-equivalent on the host: run it only on a lab machine.
tools:
  network-xray:
    runtime: docker
    docker:
      up:
        docker run -d --rm
          --name "{name}_network_xray"
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$(pwd)":/lab:ro
          -p { 8600 + defaults.multilab.id if defaults.multilab.id else 8600 }:8600
          ghcr.io/rclab-dev/network-xray:1
          --topo /lab/clab.yml
      message: >-
        Open http://{sys.ipurl}:{ 8600 + defaults.multilab.id if defaults.multilab.id else 8600 }/ in your browser
        (network-xray only runs 'show' commands, but it is given the Docker socket)
      down:
        docker kill '{name}_network_xray'
