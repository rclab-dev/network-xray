name: "Bug: something is wrong or missing in the picture"
description: A route, neighbor, VRF or the Best-Path panel is not shown, or shown wrong, for a running lab.
title: "[picture] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying network-xray. English or 日本語, either is fine.
        **Issues are welcome, and fixes are made in this repository.** Pull requests are not merged: the project keeps a single copyright holder. There is no SLA.
        One maintainer reads these, so the version, the start command and the raw router output below are what make a bug fixable.
        **Please do not attach `network-xray.json`** (netlab writes it; it holds the lab's passwords).

  - type: dropdown
    id: how
    attributes:
      label: How did you run it?
      options:
        - netlab tool (tools.network_xray)
        - docker run with a containerlab lab
        - xray.sh / run.sh (examples or a release package)
        - GitHub Codespaces
        - Other (say below)
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command you started it with
      description: The full `docker run …` line, the `./xray.sh …` line, or the `tools:` part of your netlab topology.
      placeholder: |
        ./xray.sh examples/q13-bgp-static/q13.clab.yml
      render: shell
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: network-xray version (image tag or commit), and netlab / containerlab
      description: |
        Image: the tag you pulled and its digest, `docker image inspect ghcr.io/rclab-dev/network-xray:1 --format '{{index .RepoDigests 0}}'`.
        From a clone (xray.sh): the commit, `git rev-parse --short HEAD`. Release package: its version number.
        Then `netlab version` (if used) and `containerlab version`.
      placeholder: "network-xray :1 sha256:… (or commit ae7b4e9) · netlab 26.10 · containerlab 0.82.0"
    validations:
      required: true

  - type: input
    id: routers
    attributes:
      label: Device type and OS version
      description: |
        For each kind of router involved (containerlab kind and OS version):
        FRR: `docker exec <node> vtysh -c 'show version'` · SR Linux: `docker exec <node> sr_cli show version` · Cisco IOL: `show version` over SSH.
      placeholder: "FRR 8.4 (linux, all nodes) · cisco_iol IOS-XE 17.18.02 (r3)"
    validations:
      required: true

  - type: dropdown
    id: what
    attributes:
      label: What was not visible (or wrong)?
      multiple: true
      options:
        - Topology (a node or link missing / wrong)
        - OSPF neighbor or interface
        - BGP neighbor (session state)
        - BGP table (a prefix or a path missing)
        - Best-Path Decision panel (wrong winner or reason)
        - Routing table
        - VRF (button missing, wrong VRF shown)
        - validate band (netlab tests, ✓ Solved)
        - A router stays grey / "old"
        - Other (say below)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what you saw
      description: Name the node, and the prefix / neighbor if there is one.
      placeholder: |
        On r1, 10.0.0.0/24 has two paths in `show ip bgp`, but the BGP table in the DeepDive shows one.
    validations:
      required: true

  - type: textarea
    id: cli
    attributes:
      label: Raw output of the show commands involved
      description: |
        The router's own answer, as printed, for the commands that match what is wrong, so we can see what network-xray had to read.
        FRR: `docker exec <node> vtysh -c 'show ip bgp vrf all json'` (BGP) · `… 'show ip ospf vrf all neighbor json'` (OSPF) · `… 'show ip route vrf all json'` (routes).
        SR Linux: `docker exec <node> sr_cli "info from state network-instance default protocols bgp neighbor * | as json"`.
        Cisco IOL: `show ip bgp`, `show ip bgp summary`, `show ip ospf neighbor`, `show ip route` (plain text is what network-xray reads).
        **Remove secrets before pasting:** passwords, keys, SNMP communities, and any addresses or names you do not want public.
        Shorten it to the part that matters if it is long, but keep the header lines.
      render: text
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional, helps a lot)
      description: A screenshot of the page showing the problem (drag the image into this box). Hide anything you do not want public.

  - type: textarea
    id: state
    attributes:
      label: The state network-xray read (optional, helps a lot)
      description: |
        - netlab tool / docker run: copy it out of the running network-xray container:
          `docker cp <network-xray container>:/tmp/network-xray/xray-states.js .`
          (the container name: `docker ps | grep network` — with netlab it is `<lab>_network_xray`)
        - xray.sh / run.sh: the file `xray-states.js` in the repository folder (or the package folder).
        It holds the routers' state (addresses, neighbors, routes), not passwords. Remove anything you do not want public, then attach the file or paste the part for the node.

  - type: textarea
    id: topo
    attributes:
      label: Topology (optional)
      description: The netlab topology or the .clab.yml, or the smallest lab that shows the problem.
      render: yaml
