!
frr version 10.0_git
frr defaults traditional
hostname r3
no ipv6 forwarding
!
interface eth1
 description To r2
 ip address 10.11.0.20/24
exit
!
ip route 0.0.0.0/0 10.11.0.10
ip route 8.8.8.0/24 lo
!
interface lo
 ip address 8.8.8.8/32
exit
!
router bgp 65002
 bgp router-id 8.8.8.8
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.11.0.10 remote-as 65001
 !
 address-family ipv4 unicast
  network 8.8.8.0/24
  neighbor 10.11.0.10 route-map PERMIT in
  neighbor 10.11.0.10 route-map PERMIT out
 exit-address-family
exit
!
route-map PERMIT permit 10
exit
!
end
