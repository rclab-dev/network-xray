hostname r2
interface Ethernet0/1
 ip address 10.10.0.20 255.255.255.0
 no shutdown
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 no shutdown
ip route 8.8.8.0 255.255.255.0 Null0
router bgp 65002
 bgp router-id 2.2.2.2
 timers bgp 3 9
 neighbor 10.10.0.10 remote-as 65001
 address-family ipv4
  network 8.8.8.0 mask 255.255.255.0
 exit-address-family
