!
hostname r2
!
interface eth1
 ip address 10.10.0.20/24
exit
interface lo
 ip address 2.2.2.2/32
exit
ip route 2.2.2.0/24 lo
bgp as-path access-list DENY deny _65099_
bgp as-path access-list DENY permit .*
route-map INBOUND permit 10
 match as-path DENY
exit
router bgp 65002
 bgp router-id 2.2.2.2
 timers bgp 3 9
 no bgp ebgp-requires-policy
 neighbor 10.10.0.10 remote-as 65001
 address-family ipv4 unicast
  network 2.2.2.0/24
  neighbor 10.10.0.10 route-map INBOUND in
 exit-address-family
exit
!
end
