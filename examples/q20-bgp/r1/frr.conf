!
hostname r1
!
interface eth1
 ip address 10.10.0.10/24
exit
interface lo
 ip address 1.1.1.1/32
exit
ip route 1.1.1.0/24 lo
route-map OUTBOUND permit 10
 set as-path prepend 65099 65099
exit
router bgp 65001
 bgp router-id 1.1.1.1
 timers bgp 3 9
 no bgp ebgp-requires-policy
 neighbor 10.10.0.20 remote-as 65002
 address-family ipv4 unicast
  network 1.1.1.0/24
  neighbor 10.10.0.20 route-map OUTBOUND out
 exit-address-family
exit
!
end
