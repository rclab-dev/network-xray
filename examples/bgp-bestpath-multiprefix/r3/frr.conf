frr version 8.4_git
frr defaults traditional
hostname r3
no ipv6 forwarding
!
ip route 8.8.8.0/24 Null0
ip route 9.9.9.0/24 Null0
!
interface eth1
 ip address 10.1.13.3/24
exit
!
interface lo
 ip address 3.3.3.3/32
exit
!
router bgp 65003
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.1.13.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 3.3.3.3/32
  network 8.8.8.0/24
  network 9.9.9.0/24
 exit-address-family
exit
!
end
