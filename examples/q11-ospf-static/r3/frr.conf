!
hostname r3
!
interface eth1
 ip address 10.11.0.20/24
 ip ospf hello-interval 5
exit
interface eth2
 ip address 10.12.0.20/24
 ip ospf hello-interval 5
exit
interface lo
 ip address 3.3.3.3/32
exit
router ospf
 ospf router-id 3.3.3.3
 network 10.11.0.0/24 area 0
 network 10.12.0.0/24 area 0
 network 3.3.3.3/32 area 0
exit
!
end
