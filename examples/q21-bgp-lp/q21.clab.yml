name: q21-bgp-lp
# nx_lab_isolated_routes: nodes do not route via the containerlab mgmt network (RouteCrushLab parity)
# network-xray demo lab — RCL "Q21" faithful: 3 FRR routers, eBGP, a SINGLE prefix
# 8.8.8.0/24 reachable via both r2 (AS65002) and r3 (AS65003). r1 de-preferences r2 with
# LocalPref 50 (route-map LOW_LP), so r3 (default LocalPref 100) wins by Local Preference
# (100 > 50). The X-Ray Best-Path Decision shows the winner + reason; clicking the loser
# row draws the counterfactual (Loser-Path) arrow with "LocPrf 50 < 100".
#   Next-Hop: r2 = 10.10.0.20 (loser, LP50) · r3 = 10.11.0.20 (best, LP100)
# Matches RouteCrushLab Q21 and the Zenn article "bgp-bestpath-visualized".
topology:
  nodes:
    r1: { kind: linux, image: frrouting/frr@sha256:990e83490108b686fd6df3b1cafa6bdbb2714acb00eedb9a89693946f46f45ce, binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf], exec: ["sh -c 'ip route del default 2>/dev/null || true'", "sh -c 'grep -q \"^router bgp\" /etc/frr/frr.conf || exit 0; for i in $(seq 1 30); do vtysh -c \"show running-config\" 2>/dev/null | grep -q \"^router bgp\" && exit 0; sleep 2; vtysh -f /etc/frr/frr.conf >/dev/null 2>&1; done'"] }  # nx_bgp_reapply
    r2: { kind: linux, image: frrouting/frr@sha256:990e83490108b686fd6df3b1cafa6bdbb2714acb00eedb9a89693946f46f45ce, binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf], exec: ["sh -c 'ip route del default 2>/dev/null || true'", "sh -c 'grep -q \"^router bgp\" /etc/frr/frr.conf || exit 0; for i in $(seq 1 30); do vtysh -c \"show running-config\" 2>/dev/null | grep -q \"^router bgp\" && exit 0; sleep 2; vtysh -f /etc/frr/frr.conf >/dev/null 2>&1; done'"] }  # nx_bgp_reapply
    r3: { kind: linux, image: frrouting/frr@sha256:990e83490108b686fd6df3b1cafa6bdbb2714acb00eedb9a89693946f46f45ce, binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf], exec: ["sh -c 'ip route del default 2>/dev/null || true'", "sh -c 'grep -q \"^router bgp\" /etc/frr/frr.conf || exit 0; for i in $(seq 1 30); do vtysh -c \"show running-config\" 2>/dev/null | grep -q \"^router bgp\" && exit 0; sleep 2; vtysh -f /etc/frr/frr.conf >/dev/null 2>&1; done'"] }  # nx_bgp_reapply
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
