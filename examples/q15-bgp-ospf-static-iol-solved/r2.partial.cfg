hostname r2
interface Ethernet0/1
 ip address 10.10.0.20 255.255.255.0
 no shutdown
interface Ethernet0/2
 ip address 10.11.0.10 255.255.255.0
 no shutdown
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 no shutdown
router ospf 1
 network 2.2.2.2 0.0.0.0 area 0
 network 10.10.0.0 0.0.0.255 area 0
router bgp 65001
 timers bgp 3 9
 neighbor 1.1.1.1 remote-as 65001
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 10.11.0.20 remote-as 65002
 address-family ipv4
  neighbor 1.1.1.1 next-hop-self
  neighbor 10.11.0.20 route-map PERMIT in
  neighbor 10.11.0.20 route-map PERMIT out
 exit-address-family
route-map PERMIT permit 10
