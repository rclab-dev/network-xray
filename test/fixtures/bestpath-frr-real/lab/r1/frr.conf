frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface eth1
 ip address 10.10.0.10/24
exit
interface eth2
 ip address 10.11.0.10/24
exit
interface eth3
 ip address 10.12.0.10/24
exit
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.10.0.20 remote-as 65002
 neighbor 10.11.0.20 remote-as 65003
 neighbor 10.12.0.20 remote-as 65001
 neighbor 10.12.0.20 shutdown
exit
!
end
