hostname r1
interface Ethernet0/1
 ip address 10.10.0.10 255.255.255.0
 no shutdown
interface Ethernet0/2
 ip address 10.11.0.10 255.255.255.0
 no shutdown
interface Ethernet0/3
 ip address 10.12.0.10 255.255.255.0
 no shutdown
router bgp 65001
 bgp router-id 1.1.1.1
 timers bgp 3 9
 neighbor 10.10.0.20 remote-as 65002
 neighbor 10.11.0.20 remote-as 65003
 neighbor 10.12.0.20 remote-as 65001
 neighbor 10.12.0.20 shutdown
route-map LP200 permit 10
 set local-preference 200
