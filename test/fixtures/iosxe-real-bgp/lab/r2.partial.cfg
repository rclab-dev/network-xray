hostname r2
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
interface Ethernet0/1
 ip address 10.10.0.20 255.255.255.0
 no shutdown
ip route 203.0.113.0 255.255.255.0 Null0
router bgp 65002
 bgp router-id 2.2.2.2
 timers bgp 3 9
 neighbor 10.10.0.10 remote-as 65001
 address-family ipv4
  network 203.0.113.0 mask 255.255.255.0
 exit-address-family
route-map PREPEND permit 10
 set as-path prepend 65002 65002
route-map INCOMPLETE permit 10
 set origin incomplete
route-map MED50 permit 10
 set metric 50
route-map MED10 permit 10
 set metric 10
route-map BADNH permit 10
 set ip next-hop 192.0.2.99
route-map AS1 permit 10
 set as-path prepend 65009
